<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voltbox Support ⚡</title>
  <style>
    :root {
      --bg: #0f1729;
      --bg-elevated: #16203a;
      --agent-bubble: #1e2a44;
      --agent-text: #e6ebf5;
      --user-grad: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      --accent: #a855f7;
      --muted: #8b97b3;
      --border: #263354;
      --error-bg: #3a1e2a;
      --error-border: #7a2a44;
      --error-text: #f5c2d4;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background:
        radial-gradient(1100px 600px at 15% -10%, rgba(139, 92, 246, 0.14), transparent 60%),
        radial-gradient(900px 600px at 100% 110%, rgba(236, 72, 153, 0.12), transparent 55%),
        var(--bg);
      color: var(--agent-text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 20px;
    }

    .chat {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      height: min(760px, calc(100dvh - 64px));
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 24px 60px -20px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.02) inset;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(139, 92, 246, 0.10), transparent), var(--bg-elevated);
      flex-shrink: 0;
    }

    header .bolt {
      font-size: 22px;
      line-height: 1;
    }

    header h1 {
      font-size: 17px;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.2px;
    }

    header .sub {
      font-size: 12px;
      color: var(--muted);
      margin-left: auto;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--bg);
    }

    @media (max-width: 680px) {
      body { padding: 0; }
      .chat {
        height: 100dvh;
        max-width: none;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    .row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }

    .row.user { align-self: flex-end; align-items: flex-end; }
    .row.agent { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .row.user .bubble {
      background: var(--user-grad);
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .row.agent .bubble {
      background: var(--agent-bubble);
      color: var(--agent-text);
      border-bottom-left-radius: 5px;
    }

    .row.error .bubble {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      border-bottom-left-radius: 5px;
    }

    /* Thinking indicator */
    .thinking .bubble {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }
    .dots { display: inline-flex; gap: 4px; }
    .dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      animation: blink 1.4s infinite both;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* Steps panel */
    .steps {
      margin-top: 8px;
      width: 100%;
    }
    .steps summary {
      cursor: pointer;
      font-size: 13px;
      color: var(--muted);
      padding: 6px 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      user-select: none;
      list-style: none;
      display: inline-block;
    }
    .steps summary::-webkit-details-marker { display: none; }
    .steps[open] summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .steps summary:hover { color: var(--agent-text); }

    .step-list {
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 10px 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(22, 32, 58, 0.5);
    }
    .step { display: flex; flex-direction: column; gap: 6px; }
    .badge {
      align-self: flex-start;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(168, 85, 247, 0.18);
      color: #d8b4fe;
      border: 1px solid rgba(168, 85, 247, 0.35);
    }
    .step .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }
    .step pre {
      margin: 0;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 12.5px;
      line-height: 1.45;
      overflow-x: auto;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: #c6d0e6;
    }

    /* Composer */
    .composer {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg-elevated);
      flex-shrink: 0;
    }
    .composer textarea {
      flex: 1;
      resize: none;
      background: var(--bg);
      color: var(--agent-text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 15px;
      font-family: inherit;
      line-height: 1.4;
      max-height: 120px;
      outline: none;
    }
    .composer textarea:focus { border-color: var(--accent); }
    .composer textarea:disabled { opacity: 0.5; }

    .composer button {
      background: var(--user-grad);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .composer button:disabled { opacity: 0.45; cursor: not-allowed; }
    .composer button:not(:disabled):hover { filter: brightness(1.08); }

    .messages::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>
  <div class="chat">
    <header>
      <span class="bolt">⚡</span>
      <h1>Voltbox Support</h1>
      <span class="sub">Powerstations &amp; Solar</span>
    </header>

    <div class="messages" id="messages"></div>

    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Nachricht an den Support …" autocomplete="off"></textarea>
      <button type="submit" id="send">Senden</button>
    </form>
  </div>

  <script>
    // Beim Wechsel auf die Syntax-Instanz nur diese Zeile ändern.
    const WEBHOOK_URL = "<<REPLACE_WITH_YOUR_N8N_HOST>>/webhook/voltbox-agent";
    const SESSION_KEY = "voltbox_session";

    const messagesEl = document.getElementById("messages");
    const formEl = document.getElementById("composer");
    const inputEl = document.getElementById("input");
    const sendEl = document.getElementById("send");

    // --- Session ---
    let sessionId = localStorage.getItem(SESSION_KEY);
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      localStorage.setItem(SESSION_KEY, sessionId);
    }

    // --- Helpers ---
    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(text, who) {
      const row = document.createElement("div");
      row.className = "row " + who;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollToBottom();
      return row;
    }

    function showThinking() {
      const row = document.createElement("div");
      row.className = "row agent thinking";
      row.innerHTML =
        '<div class="bubble">Agent denkt' +
        '<span class="dots"><span></span><span></span><span></span></span></div>';
      messagesEl.appendChild(row);
      scrollToBottom();
      return row;
    }

    function prettyObservation(observation) {
      if (typeof observation !== "string") {
        try { return JSON.stringify(observation, null, 2); }
        catch { return String(observation); }
      }
      try {
        return JSON.stringify(JSON.parse(observation), null, 2);
      } catch {
        return observation;
      }
    }

    function renderSteps(row, steps) {
      const details = document.createElement("details");
      details.className = "steps";

      const summary = document.createElement("summary");
      summary.textContent = "🔧 Agent-Schritte (" + steps.length + ")";
      details.appendChild(summary);

      const list = document.createElement("div");
      list.className = "step-list";

      steps.forEach((step) => {
        const action = (step && step.action) || {};
        const stepEl = document.createElement("div");
        stepEl.className = "step";

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = action.tool || "unbekannt";
        stepEl.appendChild(badge);

        const inLabel = document.createElement("span");
        inLabel.className = "label";
        inLabel.textContent = "Input";
        stepEl.appendChild(inLabel);

        const inPre = document.createElement("pre");
        try {
          inPre.textContent = JSON.stringify(action.toolInput, null, 2);
        } catch {
          inPre.textContent = String(action.toolInput);
        }
        stepEl.appendChild(inPre);

        const outLabel = document.createElement("span");
        outLabel.className = "label";
        outLabel.textContent = "Ergebnis";
        stepEl.appendChild(outLabel);

        const outPre = document.createElement("pre");
        outPre.textContent = prettyObservation(step && step.observation);
        stepEl.appendChild(outPre);

        list.appendChild(stepEl);
      });

      details.appendChild(list);
      row.appendChild(details);
      scrollToBottom();
    }

    function setBusy(busy) {
      inputEl.disabled = busy;
      sendEl.disabled = busy;
      if (!busy) inputEl.focus();
    }

    // Auto-grow textarea
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
    });

    // Enter sends, Shift+Enter = newline
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        formEl.requestSubmit();
      }
    });

    async function sendMessage(text) {
      addMessage(text, "user");
      setBusy(true);
      const thinkingRow = showThinking();

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, sessionId: sessionId }),
        });

        if (!res.ok) throw new Error("HTTP " + res.status);

        const data = await res.json();
        thinkingRow.remove();

        const reply = (data && data.reply) || "(keine Antwort erhalten)";
        const row = addMessage(reply, "agent");

        if (data && Array.isArray(data.steps) && data.steps.length > 0) {
          renderSteps(row, data.steps);
        }
      } catch (err) {
        thinkingRow.remove();
        addMessage(
          "Verbindung zum Agenten fehlgeschlagen – nochmal versuchen.",
          "error"
        );
      } finally {
        setBusy(false);
      }
    }

    formEl.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      inputEl.style.height = "auto";
      sendMessage(text);
    });

    // Greeting
    addMessage(
      "Hallo! 👋 Ich bin dein Voltbox-Support-Agent. Frag mich z. B. nach deinem Bestellstatus, Produkten oder deiner Powerstation.",
      "agent"
    );
    inputEl.focus();
  </script>
</body>
</html>
