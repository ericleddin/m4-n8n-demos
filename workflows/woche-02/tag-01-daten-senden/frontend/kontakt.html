<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f0f;
      --surface:  #181818;
      --border:   #2a2a2a;
      --accent:   #c8f135;
      --muted:    #555;
      --text:     #e8e8e8;
      --radius:   4px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3rem 3rem 2.5rem;
      position: relative;
      animation: fadeUp .5s ease both;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .label-top {
      font-size: .7rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: .75rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 2.25rem;
      color: #fff;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .field {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .45rem;
    }

    input, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      font-weight: 300;
      padding: .75rem 1rem;
      outline: none;
      transition: border-color .2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    button {
      width: 100%;
      margin-top: .5rem;
      padding: .9rem 1rem;
      background: var(--accent);
      color: #0f0f0f;
      border: none;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: .85rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
    }

    button:hover  { opacity: .88; }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #0f0f0f4a;
      border-top-color: #0f0f0f;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      margin-top: 1.25rem;
      padding: .85rem 1.1rem;
      border-radius: var(--radius);
      font-size: .88rem;
      display: none;
      align-items: center;
      gap: .6rem;
    }

    .toast.success {
      background: #c8f13515;
      border: 1px solid #c8f13540;
      color: var(--accent);
      display: flex;
    }

    .toast.error {
      background: #ff4d4d15;
      border: 1px solid #ff4d4d40;
      color: #ff7070;
      display: flex;
    }

    .footer-note {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: .72rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="label-top">n8n Webhook Demo</p>
    <h1>Schreib uns <em>einfach.</em></h1>

    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="Max Mustermann" autocomplete="name">
    </div>

    <div class="field">
      <label for="email">E-Mail</label>
      <input id="email" type="email" placeholder="max@beispiel.de" autocomplete="email">
    </div>

    <div class="field">
      <label for="nachricht">Nachricht</label>
      <textarea id="nachricht" placeholder="Deine Nachricht …"></textarea>
    </div>

    <button id="btn" onclick="submit()">
      <span id="btnLabel">Absenden</span>
      <div class="spinner" id="spinner"></div>
    </button>

    <div class="toast" id="toast"></div>

    <div class="footer-note">
      <div class="dot"></div>
      Daten werden via Webhook an n8n gesendet und in Supabase gespeichert.
    </div>
  </div>

  <script>
    // ⚠️ Webhook-URL anpassen sobald der Workflow aktiviert ist
    const WEBHOOK_URL = '<<REPLACE_WITH_YOUR_N8N_HOST>>/webhook/kontakt';

    async function submit() {
      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const nachricht = document.getElementById('nachricht').value.trim();
      const btn      = document.getElementById('btn');
      const spinner  = document.getElementById('spinner');
      const btnLabel = document.getElementById('btnLabel');
      const toast    = document.getElementById('toast');

      // Validierung
      if (!name || !email || !nachricht) {
        showToast('error', '⚠ Bitte alle Felder ausfüllen.');
        return;
      }

      // Lade-State
      btn.disabled   = true;
      spinner.style.display = 'block';
      btnLabel.textContent  = 'Wird gesendet …';
      toast.className = 'toast';
      toast.style.display = 'none';

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, nachricht })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        showToast('success', '✓ Nachricht gesendet! Wir melden uns bald.');
        document.getElementById('name').value = '';
        document.getElementById('email').value = '';
        document.getElementById('nachricht').value = '';

      } catch (err) {
        showToast('error', `✕ Fehler: ${err.message}. Ist der Workflow aktiv?`);
      } finally {
        btn.disabled  = false;
        spinner.style.display = 'none';
        btnLabel.textContent  = 'Absenden';
      }
    }

    function showToast(type, msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className   = `toast ${type}`;
    }

    // Enter-Taste in Input-Feldern
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') submit();
    });
  </script>
</body>
</html>
